  if (e.kind === "creative") mount(common, await creativeDetail(e, after, my));
  else if (e.kind === "video") mount(common, videoDetail(e, after));
  else mount(common, await actorDetail(e, after));
  state.view = { refresh: () => route(true) };
}

const fact = (label, value, wide) => (value ? h("div", { class: wide ? "fact wide" : "fact" }, h("span", { class: "label" }, label), h("span", {}, value)) : null);

function brandBlock(b) {
  const j = b.json && typeof b.json === "object" ? b.json : {};
  const colors = j.colors || {};
  const swatches = SWATCH_ROLES
    .filter(([k]) => typeof colors[k] === "string" && /^#[0-9a-f]{3,8}$/i.test(colors[k]))
    .map(([k, label]) => h("div", { class: "swatch" },
      h("i", { style: "background:" + colors[k], role: "img", "aria-label": label + " " + colors[k] }),
      h("span", {}, label), h("span", { class: "num muted" }, colors[k])));
  const fonts = j.fonts ? [j.fonts.heading, j.fonts.body].filter(Boolean).join(" / ") : "";
  const logo = typeof j.logo === "string" && (b.files || []).includes(j.logo) ? b.path + "/" + j.logo : null;
  return h("div", { class: "group" },
    h("span", { class: "label" }, "Marca" + (j.name ? " · " + j.name : "")),
    logo ? h("div", { class: "logo-box" }, h("img", { src: url(logo), alt: "Logo de " + (j.name || "la marca") })) : null,
    swatches.length ? h("div", { class: "swatches" }, swatches) : null,
    fonts ? h("p", { class: "meta" }, "Tipografías: " + fonts) : null,
    j.tone ? h("p", { class: "meta" }, "Tono: " + j.tone) : null);
}

async function creativeDetail(e, after, my) {
  const j = e.json && typeof e.json === "object" ? e.json : {};
  const name = e.title;
  const isCarousel = j.type === "carousel";
  let brand = null;
  try { brand = await api("/api/elemento?" + qs({ ruta: "clientes/" + e.profileId + "/marca" })); } catch (err) { if (err.status === 0 || err.status === 401) throw err; }
  const piece = (p) => {
    const ratio = /^\d+x\d+$/.test(p.slot) ? " r" + p.slot : /^tarjeta-\d+$/.test(p.slot) ? " tarjeta" : "";
    return h("figure", { class: "piece" + ratio },
      p.current
        ? h("a", { class: "shot", href: url(p.current.src), target: "_blank", rel: "noopener", "aria-label": "Abrir " + p.label + " en tamaño real" }, picture(p.current.src, 960, name + " · " + p.label))
        : h("div", { class: "shot" }, h("div", { class: "placeholder" }, "Sin imagen todavía")),
      h("figcaption", { class: "meta" }, p.label + (p.current ? " · versión " + p.current.n : "")),
      p.older.length ? h("div", { class: "olds" }, "Anteriores",
        p.older.map((o) => h("a", { href: url(o.src), target: "_blank", rel: "noopener", "aria-label": p.label + ", versión " + o.n }, picture(o.src, 240, ""), "v" + o.n))) : null);
  };
  const k = j.concept || {};
  const mode = j.textMode === "template" ? "Plantilla" + (j.layout ? " · " + j.layout : "") : j.textMode === "integrated" ? "Texto en la imagen" : null;
  const cp = j.copy || {};
  const copyRows = [["Texto principal", cp.primaryText], ["Titular", cp.headline], ["Descripción", cp.description], ["Botón", cp.cta], ["Nombre del anuncio", j.adName]]
    .filter(([, v]) => typeof v === "string" && v);
  const copyRow = ([label, value]) => h("div", { class: "copyrow" },
    h("div", {}, h("span", { class: "label" }, label), h("p", {}, value)),
    h("button", { class: "chip", type: "button", "aria-label": "Copiar " + label.toLowerCase(), onclick: () => copyText(value, label.toLowerCase()) }, "Copiar"));
  const pieces = e.pieces || [];
  return h("section", { class: "section" },
    h("div", { class: "info" },
      h("div", { class: "pills" }, e.status ? pill(e.status) : null, e.archived ? h("span", { class: "pill st-archived" }, "Archivado") : null),
      h("h1", {}, name),
      h("p", { class: "meta" }, isCarousel ? "Carrusel · " + plural(pieces.length, "tarjeta", "tarjetas") : "Estática"),
      detailActions(e, after)),
    pieces.length ? h("div", { class: "pieces" + (!isCarousel ? " static" : "") }, pieces.map(piece))
      : h("div", { class: "empty" }, h("p", { class: "muted" }, "Todavía no hay imágenes de este creativo.")),
    h("div", { class: copyRows.length ? "cols" : "info" },
      copyRows.length ? h("div", { class: "info" }, h("div", { class: "group" }, h("span", { class: "label" }, "Texto del anuncio"), copyRows.map(copyRow))) : null,
      h("div", { class: "info" },
        h("div", { class: "facts" },
          fact("Producto", e.productTitle || e.productId, true),
          fact("Ángulo", k.angle), fact("Conciencia", k.awareness), fact("Visual", k.visual),
          fact("Por qué es distinto", k.why, true),
          fact("Actor", e.actorId ? actorName(e.actorId) : "Solo producto"),
          fact("Texto", mode), fact("Créditos", fmtCredits(j.credits)),
          fact("Versiones", e.versionCount ? String(e.versionCount) : null),
          fact("Lote", e.batch), fact("Actualizado", fmtDate(e.updatedAt))),
        brand ? brandBlock(brand) : null)));
}

function videoDetail(e, after) {
  const j = e.json && typeof e.json === "object" ? e.json : {};
  const versions = e.versions || [];
  const scenes = e.scenes || [];
  const cur = e.current;
  const sources = [];
  if (e.finalVideo) sources.push({ label: "Final 1080p", src: e.finalVideo, poster: cur && cur.thumb });
  for (const v of [...versions].reverse()) if (v.video) sources.push({ label: "Versión " + v.n, src: v.video, poster: v.thumb });
  const stage = h("div", { class: "media" });
  const buttons = h("div", { class: "versions", role: "group", "aria-label": "Versiones" });
  const show = (i) => {
    const s = sources[i];
    stage.replaceChildren(h("video", { src: url(s.src), poster: s.poster ? thumb(s.poster, 960) : null, controls: true, playsinline: true, preload: "metadata" }));
    [...buttons.children].forEach((b, n) => b.setAttribute("aria-pressed", String(i === n)));
  };
  sources.forEach((s, i) => buttons.append(h("button", { class: "chip", type: "button", onclick: () => show(i) }, s.label)));
  if (sources.length) show(0);
  else stage.append(e.cover ? picture(e.cover, 960, "") : h("div", { class: "placeholder" }, "Todavía no hay video"));
  const vtitle = e.title;
  return h("section", { class: "section" },
    h("div", { class: "detail" },
      h("div", { class: "player" }, stage, sources.length > 1 ? buttons : null),
      h("div", { class: "info" },
        h("div", { class: "pills" }, e.status ? pill(e.status) : null, e.archived ? h("span", { class: "pill st-archived" }, "Archivado") : null),
        h("h1", {}, vtitle),
        detailActions(e, after),
        h("div", { class: "links" }, exportButton("Exportar este video", exportRequest("video", vtitle, e.path), "Exportar este video: " + vtitle)),
        h("div", { class: "facts" },
          fact("Producto", e.productTitle || e.productId, true),
          e.actorId ? h("div", { class: "fact" }, h("span", { class: "label" }, "Actor"), h("a", { href: hItem("actores/" + e.actorId) }, actorName(e.actorId))) : null,
          fact("Duración", j.durationSec ? j.durationSec + " s" : null),
          fact("Créditos", fmtCredits(j.credits)),
          fact("Versiones", versions.length ? String(versions.length) : null),
          fact("Actualizado", fmtDate(e.updatedAt))),
        j.hook ? h("div", { class: "group" }, h("span", { class: "label" }, "Gancho"), h("p", {}, j.hook)) : null,
        j.script ? h("div", { class: "group" }, h("span", { class: "label" }, "Guion"), h("p", { class: "script" }, j.script)) : null,
        scenes.length ? h("div", { class: "group" },
          h("span", { class: "label" }, "Storyboard"),
          h("div", { class: "scenes" }, scenes.map((s) =>
            h("a", { href: url(s.src), target: "_blank", rel: "noopener" }, picture(s.src, 480, "Escena " + s.n), "Escena " + s.n)))) : null,
        versions.length ? h("div", { class: "group" },
          h("span", { class: "label" }, "Historial"),
          h("div", { class: "rows" }, [...versions].reverse().map((v) =>
            h("div", { class: "row" },
              h("button", { class: "thumb-btn", type: "button", disabled: !v.video, "aria-label": "Ver versión " + v.n,
                onclick: () => { show(sources.findIndex((s) => s.src === v.video)); window.scrollTo(0, 0); } },
                v.thumb ? picture(v.thumb, 240, "") : h("span", { class: "thumb" })),
              h("div", {},
                h("p", { class: "title" }, "Versión " + v.n + (v === cur ? " (actual)" : "")),
                h("p", { class: "meta" }, [v.note, v.resolution, fmtCredits(v.credits) + " cr", fmtDate(v.createdAt)].filter(Boolean).join(" · "))),
              h("div", { class: "end links" }, safeUrl(v.url) ? h("a", { href: safeUrl(v.url), target: "_blank", rel: "noopener" }, "Higgsfield") : null))))) : null,
        safeUrl(j.finalUrl) ? h("p", { class: "links" }, h("a", { href: safeUrl(j.finalUrl), target: "_blank", rel: "noopener" }, "Ver el final en Higgsfield")) : null)));
}

async function actorDetail(e, after) {
  const j = e.json && typeof e.json === "object" ? e.json : {};
  const files = new Set(e.files || []);
  const file = (n) => (files.has(n) ? e.path + "/" + n : null);
  const nVideos = (await api("/api/elementos?" + qs({ tipo: "video", actor: e.actorId, porPagina: 1 }))).total;
  const nCreat = (await api("/api/elementos?" + qs({ tipo: "creativo", actor: e.actorId, porPagina: 1 }))).total;
  const portrait = file("retrato.png") || e.cover;
  const extra = [["angulos.png", "Ángulos"], ["character-sheet.png", "Ficha de personaje"]].filter(([n]) => file(n));
  return h("section", { class: "section" },
    h("div", { class: "detail" },
      h("div", { class: "player" },
        h("div", { class: "media", style: "aspect-ratio:4/5" }, portrait ? picture(portrait, 960, "Retrato de " + e.title) : h("div", { class: "placeholder" }, "Sin retrato")),
        portrait ? h("a", { href: url(portrait), target: "_blank", rel: "noopener" }, "Abrir el original") : null),
      h("div", { class: "info" },
        h("div", { class: "pills" }, e.archived ? h("span", { class: "pill st-archived" }, "Archivado") : null),
        h("h1", {}, e.title),
        detailActions(e, after),
        h("div", { class: "links" }, exportButton("Exportar actor", exportRequest("actor", e.title, e.path), "Exportar actor " + e.title)),
        h("div", { class: "facts" },
          fact("Género", j.gender), fact("Edad aparente", j.apparentAge ? j.apparentAge + " años" : null), fact("Versión", j.version),
          fact("Estilo", j.style, true), fact("Personalidad", j.personality, true), fact("Créditos", fmtCredits(j.credits))),
        h("div", { class: "tags" }, (j.fitsNiches || []).map((n) => h("span", { class: "tag" }, n)), (j.avoidNiches || []).map((n) => h("span", { class: "tag no", title: "No encaja" }, n))),
        h("div", { class: "links" },
          h("a", { href: hSearch(new URLSearchParams({ tipo: "video", actor: e.actorId })) }, plural(nVideos, "video", "videos")),
          h("a", { href: hSearch(new URLSearchParams({ tipo: "creativo", actor: e.actorId })) }, plural(nCreat, "creativo", "creativos")),
          extra.map(([n, label]) => h("a", { href: url(file(n)), target: "_blank", rel: "noopener" }, label))))));
}

// ---------- start ----------

// The skip link must not change the hash: the hash is the route.
$("saltar").addEventListener("click", (ev) => { ev.preventDefault(); $("app").focus(); });
window.addEventListener("hashchange", () => { route(false); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && location.protocol !== "file:") poll(); });
if (location.protocol === "file:") {
  // Opened by double-click: there is no server behind this page.
  $("cabecera").hidden = true;
  $("saltar").hidden = true;
  $("app").replaceChildren(h("div", { class: "empty" },
    h("h2", {}, "Pedile a Claude: abrí la galería"),
    h("p", { class: "muted" }, "La galería funciona con un servidor local que Claude enciende por vos. Escribile “abrí la galería” y se abre en el navegador.")));
} else {
  (async () => {
    try { await loadEstudio(); } catch (e) { /* the banner and the empty state explain it */ }
    await route(false);
    setInterval(poll, SALUD_MS);
  })();
}
